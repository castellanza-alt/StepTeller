name: StepTeller
options:
  # 2.45.1: first version that recognizes Icon Composer `.icon` packages (app icon).
  minimumXcodeGenVersion: 2.45.1
  deploymentTarget:
    iOS: "17.0"
    # Complications with WidgetKit and `containerBackground` need watchOS 10.
    watchOS: "10.0"
  developmentLanguage: it
packages:
  StepTellerCore:
    path: .
settings:
  base:
    # The core is Swift 6; the app stays in language mode 5 because HealthKit and SwiftUI in Xcode 26
    # raise concurrency warnings that are not needed here.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    COMMIT_SHA: ""
targets:
  StepTeller:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - StepTeller.entitlements
          - PrivacyInfo.xcprivacy
      # Privacy manifest (App Store): no tracking, no data collected, UserDefaults and App Group.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: StepTellerCore
        product: StepTellerCore
      - target: StepTellerLiveActivity
      # Apple Watch app, embedded in the iPhone app (installed from the Watch app on the phone).
      - target: StepTellerWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.castellanza.stepteller
        DEVELOPMENT_TEAM: 5E426PLFWN
        # Liquid Glass icon (Icon Composer): `App/AppIcon.icon`, day, night, tinted and clear variants.
        # Xcode 26+ derives the iOS 17–18 images by itself.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/StepTeller.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
        # iCloud key-value store only (CloudBackup): no CloudKit, no documents.
        com.apple.iCloud:
          enabled: 1
  # WidgetKit extension: widgets (Home Screen and lock screen). Target name, folder and bundle ID stay
  # «LiveActivity»: they are registered on App Store Connect and already installed on phones.
  StepTellerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
        excludes:
          - Info.plist
          - StepTellerWidgets.entitlements
          - PrivacyInfo.xcprivacy
      - path: LiveActivity/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
      # «Dan Dan Dan» style shared with the app: tokens, Anton text, shapes.
      - path: App/Design/MangaTokens.swift
      - path: App/Design/MangaViews.swift
      - path: App/Design/MangaShapes.swift
      - path: App/Fonts/Anton-Regular.ttf
      # JA/KO/ZH titles (subset to the characters in use, scripts/font_asia.py)
      - path: App/Fonts/DelaGothicOne-NEAT.ttf
      - path: App/Fonts/BlackHanSans-NEAT.ttf
      - path: App/Fonts/NotoSansSC-Black-NEAT.ttf
      - path: App/Fonts/NotoSansTC-Black-NEAT.ttf
    dependencies:
      - package: StepTellerCore
        product: StepTellerCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: LiveActivity/Info.plist
      properties:
        # Fallback language: a phone in an untranslated language shows English (source texts stay Italian).
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: NEAT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Anton-Regular.ttf, DelaGothicOne-NEAT.ttf, BlackHanSans-NEAT.ttf, NotoSansSC-Black-NEAT.ttf, NotoSansTC-Black-NEAT.ttf]
        NSHealthShareUsageDescription: Il widget legge i tuoi passi di oggi da Salute per mostrarli e per stimare i minuti a piedi che mancano. Non scrive nulla e non invia dati fuori dal telefono.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.castellanza.stepteller.liveactivity
        DEVELOPMENT_TEAM: 5E426PLFWN
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: LiveActivity/StepTellerWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  # Apple Watch app (1.2): one screen (`Watch/`) with today's steps from Health on the watch and the settings
  # received from the iPhone (`Shared/WatchPayload.swift`, WatchConnectivity). Same style tokens as the app.
  StepTellerWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - Info.plist
          - StepTellerWatch.entitlements
          - PrivacyInfo.xcprivacy
      - path: Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
        excludes:
          - WidgetAssets.xcassets
      # Same icon as the iPhone app (Icon Composer draws the round watchOS variant from the same layers).
      - path: App/AppIcon.icon
      - path: App/Design/MangaTokens.swift
      - path: App/Design/MangaViews.swift
      - path: App/Design/MangaShapes.swift
      # Fake steps for the simulator screenshots (`#if DEBUG` inside).
      - path: App/DebugStepsProvider.swift
      - path: App/Fonts/Anton-Regular.ttf
      - path: App/Fonts/DelaGothicOne-NEAT.ttf
      - path: App/Fonts/BlackHanSans-NEAT.ttf
      - path: App/Fonts/NotoSansSC-Black-NEAT.ttf
      - path: App/Fonts/NotoSansTC-Black-NEAT.ttf
    dependencies:
      - package: StepTellerCore
        product: StepTellerCore
      - target: StepTellerWatchWidgets
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: NEAT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: it.castellanza.stepteller
        # Works with the iPhone far away (steps from Health on the watch, last settings received).
        WKRunsIndependentlyOfCompanionApp: true
        UIAppFonts: [Anton-Regular.ttf, DelaGothicOne-NEAT.ttf, BlackHanSans-NEAT.ttf, NotoSansSC-Black-NEAT.ttf, NotoSansTC-Black-NEAT.ttf]
        NSHealthShareUsageDescription: NEAT legge i tuoi passi di oggi da Salute per mostrarli sull'orologio e stimare i minuti che mancano. Non scrive nulla e non invia dati fuori dall'orologio.
        NSHealthUpdateUsageDescription: "NEAT non scrive nulla in Salute: si limita a leggere i dati. Questa dichiarazione è richiesta da Apple per le app con accesso a Salute."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.castellanza.stepteller.watchkitapp
        DEVELOPMENT_TEAM: 5E426PLFWN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: Watch/StepTellerWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
  # Complications: the lock-screen widget code (`LiveActivity/StepsWidget.swift`, `Shared/StepsWidgetView.swift`)
  # compiled for watchOS, plus the corner family.
  StepTellerWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
        excludes:
          - Info.plist
          - StepTellerWatchWidgets.entitlements
          - PrivacyInfo.xcprivacy
      - path: WatchWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: LiveActivity/StepsWidget.swift
      - path: LiveActivity/WidgetsBundle.swift
      - path: Shared
        excludes:
          - WidgetAssets.xcassets
      - path: App/Design/MangaTokens.swift
      - path: App/Design/MangaViews.swift
      - path: App/Design/MangaShapes.swift
      - path: App/Fonts/Anton-Regular.ttf
      - path: App/Fonts/DelaGothicOne-NEAT.ttf
      - path: App/Fonts/BlackHanSans-NEAT.ttf
      - path: App/Fonts/NotoSansSC-Black-NEAT.ttf
      - path: App/Fonts/NotoSansTC-Black-NEAT.ttf
    dependencies:
      - package: StepTellerCore
        product: StepTellerCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: NEAT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Anton-Regular.ttf, DelaGothicOne-NEAT.ttf, BlackHanSans-NEAT.ttf, NotoSansSC-Black-NEAT.ttf, NotoSansTC-Black-NEAT.ttf]
        NSHealthShareUsageDescription: Il widget legge i tuoi passi di oggi da Salute per mostrarli e per stimare i minuti a piedi che mancano. Non scrive nulla e non invia dati fuori dal telefono.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.castellanza.stepteller.watchkitapp.widgets
        DEVELOPMENT_TEAM: 5E426PLFWN
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/StepTellerWatchWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
schemes:
  StepTeller:
    build:
      targets:
        StepTeller: all
    run:
      config: Debug
    archive:
      config: Release
