# Firma, carica su TestFlight e assegna la build al gruppo «Personale».
# Si avvia con un push su `ios-nativa` il cui messaggio di commit contiene:
#   [apple]       solo preparazione Apple (chiave, Bundle ID, HealthKit, record app)
#   [testflight]  preparazione + build + upload + assegnazione a «Personale»
# oppure a mano (workflow_dispatch, disponibile dopo il merge su main).
# I segreti sono usati solo qui; mai su pull request. Il repository è pubblico: nessun
# segreto, profilo o chiave deve entrare nel codice.
name: iOS TestFlight
on:
  push:
    branches: [ios-nativa]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stepteller-testflight
  cancel-in-progress: false
jobs:
  prepara:
    name: Verifica Apple (Linux)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apple]') || contains(github.event.head_commit.message, '[testflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet cryptography
      - name: Chiave, Bundle ID, HealthKit, record app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 ios/scripts/asc.py bootstrap
      - name: Libera i certificati creati dalla firma automatica
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 ios/scripts/asc.py certs

  nucleo:
    name: Nucleo (Linux)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: swift:6.1.2-noble
    steps:
      - uses: actions/checkout@v4
      - working-directory: ios
        run: swift test

  testflight:
    name: Archivia e carica (macOS)
    needs: [prepara, nucleo]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      build_number: ${{ steps.num.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Seleziona Xcode
        run: bash ios/scripts/select_xcode.sh
      - name: Installa XcodeGen
        run: brew install xcodegen
      - name: Numero di build
        id: num
        run: echo "build_number=1.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Chiave API (file temporaneo, mai nel repository)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Genera progetto
        working-directory: ios
        run: xcodegen generate
      - name: Archivia (firma automatica via API App Store Connect)
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project StepTeller.xcodeproj -scheme StepTeller -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/StepTeller.xcarchive \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${{ steps.num.outputs.build_number }}" COMMIT_SHA="${{ github.sha }}" \
            archive > build-archive.log 2>&1 \
            || { echo "::error::Archivio fallito; errori:"; grep -E "error:" build-archive.log | sort -u | cut -c1-400 | head -30; exit 1; }
      - name: Esporta IPA firmata
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>5E426PLFWN</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/StepTeller.xcarchive -exportPath build/TestFlight \
            -exportOptionsPlist build/ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Carica su App Store Connect
        working-directory: ${{ runner.temp }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ipa=$(ls "$GITHUB_WORKSPACE"/ios/build/TestFlight/*.ipa)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          # altool può uscire con 0 anche se Apple rifiuta il file: si controlla l'esito nel testo.
          if grep -q "UPLOAD FAILED" "$RUNNER_TEMP/altool.log" || ! grep -q "UPLOAD SUCCEEDED" "$RUNNER_TEMP/altool.log"; then
            echo "::error::Upload rifiutato da App Store Connect (vedi log sopra)"; exit 1
          fi
      - name: Rimuovi la chiave dal runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

  distribuisci:
    name: Attendi Apple e assegna a «Personale»
    needs: testflight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet cryptography
      - env:
          BUILD_NUMBER: ${{ needs.testflight.outputs.build_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 ios/scripts/asc.py distribute
