name: StepTeller
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"          # stesso target di briciola.
  developmentLanguage: it
packages:
  StepTellerCore:
    path: .
settings:
  base:
    # Il nucleo è Swift 6; l'app resta in modalità linguaggio 5 (come briciola.) perché HealthKit
    # e SwiftUI di Xcode 26 danno avvisi di concorrenza che qui non servono.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.4"
    CURRENT_PROJECT_VERSION: "1"
    COMMIT_SHA: ""
targets:
  StepTeller:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - StepTeller.entitlements
      - path: Shared
    dependencies:
      - package: StepTellerCore
        product: StepTellerCore
      - target: StepTellerLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.castellanza.stepteller
        DEVELOPMENT_TEAM: 5E426PLFWN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/StepTeller.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
  # Estensione WidgetKit: Live Activity del tappeto (Blocco schermo e Dynamic Island).
  StepTellerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
        excludes:
          - Info.plist
          - StepTellerWidgets.entitlements
      - path: Shared
      - path: App/Theme.swift
    dependencies:
      - package: StepTellerCore
        product: StepTellerCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Step Teller
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: Il widget legge i tuoi passi di oggi da Salute per mostrarli e per stimare i minuti a piedi che mancano. Non scrive nulla e non invia dati fuori dal telefono.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.castellanza.stepteller.liveactivity
        DEVELOPMENT_TEAM: 5E426PLFWN
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: LiveActivity/StepTellerWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
schemes:
  StepTeller:
    build:
      targets:
        StepTeller: all
    run:
      config: Debug
    archive:
      config: Release
