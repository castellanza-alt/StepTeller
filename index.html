<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Step Teller</title>
<meta name="description" content="Quanti minuti sul tappeto per chiudere i passi di oggi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Step Teller">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EFEDE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121517" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#EFEDE8; --ink:#1E2022; --soft:rgba(30,32,34,.50); --faint:rgba(30,32,34,.16); --hair:rgba(30,32,34,.08);
  --accent:#2E7F73; --accent-soft:rgba(46,127,115,.16);
  --orb1:rgba(255,255,255,.95); --orb2:rgba(178,220,210,.75); --orb3:rgba(214,206,236,.55);
  --glass:rgba(255,255,255,.42); --glass-line:rgba(255,255,255,.80); --glass-shadow:0 20px 50px rgba(30,40,40,.08);
  --m-frame:#2A2C2E; --m-frame-2:#4A4D50; --m-belt:#3B3E41; --m-soft:rgba(30,32,34,.30); --m-shadow:rgba(30,32,34,.18);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121517; --ink:#E4E2DC; --soft:rgba(228,226,220,.52); --faint:rgba(228,226,220,.16); --hair:rgba(228,226,220,.08);
    --accent:#8CCBBF; --accent-soft:rgba(140,203,191,.16);
    --orb1:rgba(60,110,104,.45); --orb2:rgba(72,66,120,.40); --orb3:rgba(120,90,70,.22);
    --glass:rgba(255,255,255,.05); --glass-line:rgba(255,255,255,.12); --glass-shadow:0 20px 50px rgba(0,0,0,.35);
    --m-frame:#D6D4CE; --m-frame-2:#9A9893; --m-belt:#B9B7B1; --m-soft:rgba(228,226,220,.34); --m-shadow:rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;overflow-x:hidden;position:relative;
}
/* luce ambientale */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform;animation:drift 28s ease-in-out infinite alternate}
.o1{width:70vw;height:70vw;left:-22vw;top:-14vh;background:var(--orb1)}
.o2{width:78vw;height:78vw;right:-30vw;top:30vh;background:var(--orb2);animation-delay:-9s;animation-duration:34s}
.o3{width:60vw;height:60vw;left:-10vw;bottom:-22vh;background:var(--orb3);animation-delay:-17s;animation-duration:40s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,-4vh) scale(1.08)}}
@media (prefers-reduced-motion: reduce){.orb{animation:none}}

.app{
  min-height:100dvh;max-width:460px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 16px) 22px calc(env(safe-area-inset-bottom) + 18px);
  display:flex;flex-direction:column;gap:0;
}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.mark{font-size:11px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--soft)}
.goal{display:flex;align-items:baseline;gap:6px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.goal input{width:64px;border:0;background:transparent;outline:0;color:var(--ink);text-align:right;
  font-family:inherit;font-size:13px;font-weight:600;line-height:1;letter-spacing:.06em;font-variant-numeric:tabular-nums;border-bottom:1px solid transparent;padding:2px 0}
.goal input:focus{border-bottom-color:var(--accent)}

/* numero in alto */
.hero-wrap{text-align:center;padding-top:clamp(18px,4vh,34px)}
.cap{font-size:11px;font-weight:600;letter-spacing:.30em;text-transform:uppercase;color:var(--soft)}
.hero{display:flex;align-items:baseline;justify-content:center;line-height:.88;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .n{font-size:clamp(108px,36vw,164px);font-weight:200;letter-spacing:-.06em}
.hero .u{font-size:17px;font-weight:500;color:var(--soft);margin-left:8px;letter-spacing:.02em}
.hero.done .n{font-size:clamp(64px,19vw,88px);font-weight:300;letter-spacing:-.04em;line-height:1.25}
.sub{font-size:14px;color:var(--soft);margin-top:12px;font-variant-numeric:tabular-nums;min-height:18px}
.sub b{color:var(--ink);font-weight:600}

/* tappeto */
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 0 4px;position:relative}
.stage::before{content:'';position:absolute;width:70%;height:60%;left:15%;top:20%;border-radius:50%;background:var(--accent-soft);filter:blur(40px);opacity:.7}
.machine{width:min(86%,330px);height:auto;overflow:visible;position:relative}
.machine .frame{fill:var(--m-frame)}
.machine .frame2{fill:var(--m-frame-2)}
.machine .belt{fill:var(--m-belt)}
.machine .line{fill:none;stroke:var(--m-frame);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.machine .line2{fill:none;stroke:var(--m-soft);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.machine .run{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:2.5 11;animation:belt 1.1s linear infinite;opacity:.95}
.machine .screen{fill:var(--accent);opacity:.85}
.machine .shadow{fill:var(--m-shadow);filter:blur(6px)}
.machine .floor{stroke:var(--hair);stroke-width:1;fill:none}
@keyframes belt{to{stroke-dashoffset:13.5}}
@media (prefers-reduced-motion: reduce){.machine .run{animation:none}}

/* pannello comandi in vetro */
.panel{
  background:var(--glass);border:1px solid var(--glass-line);border-radius:28px;padding:22px 22px 18px;
  -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);box-shadow:var(--glass-shadow);
  display:flex;flex-direction:column;gap:22px;position:relative;
}
.panel::before{content:'';position:absolute;top:0;left:28px;right:28px;height:1px;background:linear-gradient(90deg,transparent,var(--glass-line),transparent)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.steps{flex:1;min-width:0;border:0;border-bottom:1px solid var(--faint);background:transparent;outline:0;color:var(--ink);text-align:right;
  font-family:inherit;font-size:38px;font-weight:300;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;padding:0 0 6px;border-radius:0}
.steps::placeholder{color:var(--faint)}
.steps:focus{border-bottom-color:var(--accent)}
.speed-val{font-size:38px;font-weight:300;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.speed-val small{font-size:13px;font-weight:500;color:var(--soft);letter-spacing:.02em;margin-left:6px}
.gait{color:var(--accent)}

.dial{position:relative;height:54px;margin-top:4px}
.ticks{position:absolute;left:14px;right:14px;top:8px;height:16px;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px calc(100%/9)) 0 0/100% 16px no-repeat,
    repeating-linear-gradient(90deg,var(--faint) 0 1px,transparent 1px calc(100%/18)) 0 6px/100% 10px no-repeat;
  border-right:1px solid var(--ink);opacity:.5}
.nums{position:absolute;left:14px;right:14px;bottom:0;display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:var(--soft);
  font-variant-numeric:tabular-nums;pointer-events:none}
.nums span{width:0;display:flex;justify-content:center}
input[type=range]{-webkit-appearance:none;appearance:none;position:absolute;left:0;right:0;top:0;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:36px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:36px;border:0;border-radius:0;cursor:grab;
  background:linear-gradient(var(--accent),var(--accent)) center/3px 100% no-repeat, radial-gradient(circle at 50% 50%,var(--accent-soft) 0 14px,transparent 15px)}
input[type=range]::-moz-range-track{height:36px;background:transparent}
input[type=range]::-moz-range-thumb{width:3px;height:36px;border:0;border-radius:0;background:var(--accent)}
.foot{margin-top:14px;text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<main class="app">
  <header class="top">
    <div class="mark">Step Teller</div>
    <label class="goal">Obiettivo <input id="goal" type="text" inputmode="numeric" autocomplete="off" aria-label="Obiettivo passi"></label>
  </header>

  <section class="hero-wrap" aria-live="polite">
    <div class="cap" id="cap">Minuti sul tappeto</div>
    <div class="hero" id="hero"><span class="n" id="n">0</span><span class="u" id="u">min</span></div>
    <div class="sub" id="sub"></div>
  </section>

  <section class="stage">
    <!-- tappeto: disegno originale, vista laterale -->
    <svg class="machine" viewBox="0 0 360 200" aria-hidden="true">
      <ellipse class="shadow" cx="176" cy="176" rx="148" ry="7"/>
      <line class="floor" x1="10" y1="178" x2="350" y2="178"/>
      <!-- pedana -->
      <path class="frame" d="M40 150 L290 140 C302 139.5 306 146 306 152 L306 154 C306 161 300 165 292 165 L48 168 C38 168.4 32 162 32 156 C32 152 36 150.2 40 150 Z"/>
      <path class="belt" d="M46 147.4 L286 137.8 L286.6 143.6 L46.6 153 Z"/>
      <path class="run" id="belt" d="M282 139.2 L50 148.6"/>
      <path class="frame2" d="M290 141 C300 140.6 304 146 304 152 L304 154 C304 160 299 163.6 292 163.8 L288 164 L288 141.2 Z"/>
      <circle class="frame2" cx="46" cy="170" r="3.6"/>
      <circle class="frame2" cx="268" cy="168" r="3.6"/>
      <!-- montanti -->
      <path class="line2" d="M268 141 C272 118 279 80 288 48"/>
      <path class="line" d="M282 140 C286 117 293 78 302 44"/>
      <!-- console -->
      <g transform="rotate(-8 300 40)">
        <rect class="frame" x="270" y="33" width="60" height="13" rx="6.5"/>
        <rect class="screen" x="277" y="36.5" width="46" height="6" rx="3"/>
      </g>
      <!-- corrimano ad anello -->
      <path class="line" d="M298 68 C268 68 240 72 232 80 C226 87 230 94 240 94 C258 93.5 276 93 293 92.5"/>
      <path class="line2" d="M285 70 C258 71 236 75 228 82 C223 88 226 95 234 95.5"/>
    </svg>
  </section>

  <section class="panel">
    <div class="row">
      <label class="lbl" for="steps">Passi di oggi</label>
      <input class="steps" id="steps" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
    </div>
    <div>
      <div class="row">
        <span class="lbl">Velocità · <span class="gait" id="gait">cammino</span></span>
        <span class="speed-val"><span id="sv">6,0</span><small>km/h</small></span>
      </div>
      <div class="dial">
        <div class="ticks"></div>
        <input id="speed" type="range" min="3" max="12" step="0.1" value="6" aria-label="Velocità in km/h">
        <div class="nums"><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span></div>
      </div>
    </div>
  </section>
  <div class="foot" id="foot"></div>
</main>

<script>
/* ---------- modello: passi = cadenza(v) × minuti ----------
   Corsa: curva di letteratura scalata sui dati reali di Will (export HealthFit):
     13 set 2026 — 8,28 km/h · 154,8 spm · passo 910 mm
     15 set 2026 — 8,31 km/h · 152,2 spm · passo 907 mm   → media 8,3 km/h · 153,5 spm
   Cammino: curva di letteratura per uomo ~178 cm (Inferred) finché non c'è una camminata esportata. */
const MODEL = (() => {
  const DEF = {
    walk: [[2,75],[3,90],[4,101],[5,110],[6,119],[7,129],[8,138]],
    run:  [[6,152],[7,156],[8,159],[9,162],[10,165],[12,170],[14,176]]
  };
  const CAL = { walk: [], run: [[8.3, 153.5]] };
  const RUN_FROM = 7.1;                       // sotto si cammina, da qui si corre
  const interp = (p, v) => { let i = 0; while (i < p.length - 2 && v > p[i+1][0]) i++;
    const [x0,y0] = p[i], [x1,y1] = p[i+1]; return y0 + (y1-y0)*(v-x0)/(x1-x0); };
  const ratio = (g, v) => { const p = CAL[g].map(c => [c[0], c[1]/interp(DEF[g], c[0])]).sort((a,b)=>a[0]-b[0]);
    if (!p.length) return 1; if (p.length === 1 || v <= p[0][0]) return p[0][1];
    if (v >= p[p.length-1][0]) return p[p.length-1][1]; return interp(p, v); };
  const gait = v => v >= RUN_FROM ? 'run' : 'walk';
  const cadence = v => { const g = gait(v); return interp(DEF[g], v) * ratio(g, v); };
  return { gait, cadence, CAL };
})();

(() => {
  const $ = id => document.getElementById(id);
  const fmt = (n, d = 0) => Number(n).toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d });
  const digits = s => parseInt(String(s).replace(/\D/g, ''), 10) || 0;
  const today = () => new Date().toLocaleDateString('sv-SE');
  const KEY = 'stepteller.v4';

  let S = { goal: 10000, steps: 0, day: today(), speed: 6 };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  if (S.day !== today()) { S.steps = 0; S.day = today(); }          // i passi di ieri non valgono oggi
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  // da Comandi: ?passi=7200 (&target=10000 &v=6)
  const q = new URLSearchParams(location.search);
  const qn = k => { const v = parseFloat((q.get(k) || '').replace(',', '.')); return isFinite(v) ? v : null; };
  if (qn('passi') !== null) { S.steps = Math.max(0, Math.round(qn('passi'))); S.day = today(); }
  if (qn('target') !== null) S.goal = Math.max(0, Math.round(qn('target')));
  if (qn('v') !== null) S.speed = qn('v');
  S.speed = Math.min(12, Math.max(3, Math.round(S.speed * 10) / 10));

  let beltAnim = null;
  function render() {
    const v = S.speed, cad = MODEL.cadence(v), gap = Math.max(0, S.goal - S.steps);
    const run = MODEL.gait(v) === 'run';
    if (document.activeElement !== $('steps')) $('steps').value = S.steps ? fmt(S.steps) : '';
    if (document.activeElement !== $('goal'))  $('goal').value = fmt(S.goal);
    $('speed').value = v;
    $('sv').textContent = fmt(v, 1);
    $('gait').textContent = run ? 'corsa' : 'cammino';

    if (gap > 0) {
      const min = Math.ceil(gap / cad), km = v * min / 60;
      $('hero').classList.remove('done');
      $('cap').textContent = 'Minuti sul tappeto';
      $('n').textContent = fmt(min); $('u').textContent = 'min';
      $('sub').innerHTML = 'per <b>' + fmt(gap) + '</b> passi · ' + fmt(km, 1) + ' km · ' + fmt(cad) + ' passi/min';
    } else {
      $('hero').classList.add('done');
      $('cap').textContent = 'Obiettivo chiuso';
      $('n').textContent = 'Fatto'; $('u').textContent = '';
      $('sub').innerHTML = '<b>' + fmt(S.steps) + '</b> su ' + fmt(S.goal);
    }
    $('foot').textContent = run ? 'corsa tarata sulle tue corse · set 2026' : 'cammino · curva standard';

    // il nastro gira alla velocità scelta
    if (!beltAnim && $('belt').getAnimations) beltAnim = $('belt').getAnimations()[0] || null;
    if (beltAnim) beltAnim.playbackRate = gap > 0 ? v / 6 : 0.0001;
  }

  $('speed').addEventListener('input', e => { S.speed = parseFloat(e.target.value); save(); render(); });
  $('steps').addEventListener('input', e => { S.steps = digits(e.target.value); S.day = today();
    e.target.value = S.steps ? fmt(S.steps) : ''; save(); render(); });
  $('goal').addEventListener('input', e => { S.goal = digits(e.target.value); save(); render(); });
  ['steps', 'goal'].forEach(id => {
    $(id).addEventListener('focus', e => setTimeout(() => e.target.select(), 0));
    $(id).addEventListener('blur', render);
    $(id).addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  });

  save(); render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
