name: StepTeller
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"          # stesso target di briciola.
  developmentLanguage: it
packages:
  StepTellerCore:
    path: .
settings:
  base:
    # Il nucleo è Swift 6; l'app resta in modalità linguaggio 5 (come briciola.) perché HealthKit
    # e SwiftUI di Xcode 26 danno avvisi di concorrenza che qui non servono.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    COMMIT_SHA: ""
targets:
  StepTeller:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - StepTeller.entitlements
    dependencies:
      - package: StepTellerCore
        product: StepTellerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.castellanza.stepteller
        DEVELOPMENT_TEAM: 5E426PLFWN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/StepTeller.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
schemes:
  StepTeller:
    build:
      targets:
        StepTeller: all
    run:
      config: Debug
    archive:
      config: Release
